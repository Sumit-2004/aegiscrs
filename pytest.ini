[pytest]
# crs_scratch/ holds real fetched third-party source from os_discovery.py
# runs (e.g. boost ships its own check_odr_test.py, which matches pytest's
# default *_test.py collection pattern and crashes collection). It's
# gitignored scratch data, never test code for this project, so pytest
# should never walk into it regardless of how it's invoked.
testpaths = tests
