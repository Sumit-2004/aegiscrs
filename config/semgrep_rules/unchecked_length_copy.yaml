rules:
  - id: unchecked-length-memcpy
    languages: [c]
    severity: WARNING
    message: >-
      memcpy() is called with a length value; confirm it is validated against
      the destination buffer's capacity before this call. If it comes from
      untrusted input and is unchecked, this is a potential out-of-bounds
      write (CWE-787).
    metadata:
      cwe: CWE-787
    patterns:
      - pattern-either:
          # bare memcpy plus common project-internal aliases/wrappers for it
          # (e.g. zlib's zmemcpy in zutil.h) - semgrep doesn't run the C
          # preprocessor, so a macro-renamed memcpy needs its own pattern.
          - pattern: memcpy($DST, $SRC, $LEN)
          - pattern: zmemcpy($DST, $SRC, $LEN)
          - pattern: bcopy($SRC, $DST, $LEN)
